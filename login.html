<!DOCTYPE html>
<html lang="es" data-theme="noche">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — CIBIOGEN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/theme.js" defer></script>
</head>
<body>
    <header class="cabecera">
        <div class="cabecera-brand">
            <a href="index.html">
                <img src="img/logo_cibiogen.png" alt="Logo CIBIOGEN">
                <h1>CIBIOGEN</h1>
            </a>
        </div>
        <div class="cabecera-actions">
            <a class="top-right-login" href="index.html">← Volver</a>
        </div>
    </header>
    <div class="login-root">
        <div class="login-card">
            <div class="login-form">
                <h2>Inicia sesión</h2>
                <form id="login-form">
                    <div class="form-row">
                        <label for="name">Nombre</label>
                        <input id="name" name="name" type="text" required placeholder="Tu nombre completo">
                    </div>
                    <div class="form-row">
                        <label for="email">Correo</label>
                        <input id="email" name="email" type="email" placeholder="tu@ejemplo.com">
                    </div>
                    <div class="form-row">
                        <label for="avatar">Foto (opcional)</label>
                        <input id="avatar" name="avatar" type="file" accept="image/*">
                    </div>
                    <div style="display:flex;gap:8px;align-items:center">
                        <button class="btn-primary" type="submit">Iniciar sesión</button>
                        <button id="clear" type="button" class="btn-secondary">Borrar datos</button>
                    </div>
                </form>
            </div>

            <div class="profile-pane">
                <div id="profile-view" style="display:none">
                    <div class="profile-card">
                        <div class="avatar-wrap"><img id="profile-avatar" src="img/Libro1.jpg" alt="avatar"></div>
                        <div class="profile-meta">
                            <h3 id="profile-name"></h3>
                            <p id="profile-email" class="muted"></p>
                            <div style="margin-top:8px"><button id="logout" class="btn-primary">Cerrar sesión</button></div>
                        </div>
                    </div>

                    <div class="wall">
                        <h4>Tu muro</h4>
                        <form id="post-form">
                            <textarea id="post-text" placeholder="¿Qué quieres compartir?" rows="3"></textarea>
                            <div style="margin-top:8px"><button class="btn-primary" type="submit">Publicar</button></div>
                        </form>
                        <div id="posts" style="margin-top:12px;display:flex;flex-direction:column;gap:12px"></div>
                    </div>
                </div>

                <div id="welcome">
                    <h3>Carnet virtual</h3>
                    <p class="muted">Al iniciar sesión verás tu perfil y un pequeño muro donde puedes publicar mensajes (guardado localmente).</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
